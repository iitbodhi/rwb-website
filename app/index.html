<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RWB App · Ronin Warriors of Bengal</title>
<meta name="description" content="The Ronin Warriors of Bengal members app: service records, mileage tracker, guides and more.">
<meta name="theme-color" content="#f7f7f5" id="theme-color">
<script>/* apply the saved theme before anything draws (light unless the rider chose otherwise) */
(function () { var t = 'light'; try { t = localStorage.getItem('rwb-theme') || 'light'; } catch (e) {}
  document.documentElement.dataset.theme = t;
  var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-color').content = dark ? '#121110' : '#f7f7f5'; })();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RWB">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>/* loading screen: shown until the first screen is ready */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:22px;background:radial-gradient(90% 55% at 50% 38%,#3a1c0e 0%,#151210 55%,#0d0c0b 100%);transition:opacity .5s ease,visibility .5s}
#boot.out{opacity:0;visibility:hidden}
#boot .dial{position:relative;width:176px;height:176px;display:grid;place-items:center}
#boot .dial img{width:118px;height:118px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,.05),0 18px 60px -10px rgba(232,102,46,.6);animation:bootPop .7s cubic-bezier(.2,.9,.3,1.2) both}
#boot svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
#boot .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:5;stroke-linecap:round;stroke-dasharray:311 415}
#boot .rev{fill:none;stroke:#e8662e;stroke-width:5;stroke-linecap:round;stroke-dasharray:0 415;filter:drop-shadow(0 0 6px rgba(232,102,46,.8));animation:bootRev 1.6s cubic-bezier(.5,0,.3,1) infinite}
#boot b{font:800 15px/1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.22em;color:#f1efec;text-transform:uppercase;padding-left:.22em;white-space:nowrap}
#boot .road{position:relative;width:150px;height:3px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.07)}
#boot .road i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#e8662e 0 18px,transparent 18px 34px);animation:bootRoad .5s linear infinite;opacity:.85}
@keyframes bootRev{0%{stroke-dasharray:0 415}55%{stroke-dasharray:300 415}75%{stroke-dasharray:270 415}100%{stroke-dasharray:0 415}}
@keyframes bootRoad{from{transform:translateX(0)}to{transform:translateX(-34px)}}
@keyframes bootPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#boot .rev,#boot .road i,#boot .dial img{animation:none}#boot .rev{stroke-dasharray:200 415}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><div class="dial"><svg viewBox="0 0 176 176"><circle class="trk" cx="88" cy="88" r="66"/><circle class="rev" cx="88" cy="88" r="66"/></svg><img src="icons/logo-384.png" alt=""></div><b>Explore. Evolve. Inspire.</b><div class="road"><i></i></div></div>
<script>window.BOOT_T = performance.now();</script>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app" aria-live="polite">
  <div class="splash"><img src="icons/logo-128.png" alt="" width="96" height="96"><p>Loading…</p></div>
</div>
