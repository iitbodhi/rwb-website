<!DOCTYPE html>
<html lang="en">
<head>

<title>RWB App · Ronin Warriors of Bengal</title>
<meta name="description" content="The Ronin Warriors of Bengal members app: service records, mileage tracker, guides and more.">
<meta name="theme-color" content="#fbf3ec" id="theme-color">
<script>/* apply the saved theme before anything draws (light unless the rider chose otherwise) */
(function () { var t = 'light'; try { t = localStorage.getItem('rwb-theme') || 'light'; } catch (e) {}
  document.documentElement.dataset.theme = t;
  var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-color').content = dark ? '#0b0908' : '#fbf3ec'; })();</script>

<style>/* intro / loading screen "Ignition" (Nov 2026): the orange app-icon tile pops in, the white 3D RWB letters ride in
   from the left with speed lines, a light glint sweeps the tile and an engine-rev ring pulses out; when the app is ready
   the tile zooms open into it. About 1 s; tap skips it. Light/dark follow the rider's theme. */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;
  background:radial-gradient(60% 45% at 50% 46%,rgba(255,138,61,.30),transparent 70%),radial-gradient(70% 60% at 85% 100%,rgba(255,170,110,.35),transparent 70%),#fbf3ec;
  -webkit-tap-highlight-color:transparent;transition:opacity .34s ease .1s,visibility .34s .1s}
:root[data-theme=dark] #boot{background:radial-gradient(60% 45% at 50% 46%,rgba(232,85,30,.34),transparent 70%),radial-gradient(70% 60% at 85% 100%,rgba(120,40,12,.45),transparent 70%),#0b0908}
@media (prefers-color-scheme:dark){:root[data-theme=system] #boot{background:radial-gradient(60% 45% at 50% 46%,rgba(232,85,30,.34),transparent 70%),radial-gradient(70% 60% at 85% 100%,rgba(120,40,12,.45),transparent 70%),#0b0908}}
#boot.out{opacity:0;visibility:hidden}
#boot .b-stage{position:relative;width:132px;height:132px}
#boot .b-ring{position:absolute;inset:-2px;border-radius:34px;border:2px solid rgba(255,122,47,.75);opacity:0}
#boot .b-tile{position:absolute;inset:0;border-radius:32px;overflow:hidden;
  background:radial-gradient(120% 100% at 30% 0%,#ffa45a 0%,#f26a22 55%,#c9440e 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 22px 50px -18px rgba(201,68,14,.85),0 8px 18px -10px rgba(0,0,0,.35)}
#boot .b-tile img{position:absolute;left:8%;top:50%;width:84%;transform:translateY(-50%)}
#boot .b-tile .sp{position:absolute;left:-30%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95));opacity:0}
#boot .b-tile .sp:nth-of-type(1){top:36%;width:70%}#boot .b-tile .sp:nth-of-type(2){top:52%;width:90%}#boot .b-tile .sp:nth-of-type(3){top:66%;width:55%}
#boot .b-tile .gl{position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
#boot .b-name{margin:0;font:600 12px/1 'Barlow',system-ui,sans-serif;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;white-space:nowrap;color:#5a4636;opacity:0}
:root[data-theme=dark] #boot .b-name{color:rgba(246,238,230,.82)}
@media (prefers-color-scheme:dark){:root[data-theme=system] #boot .b-name{color:rgba(246,238,230,.82)}}
#boot.go .b-tile{animation:bPop .5s cubic-bezier(.34,1.56,.64,1) both}
#boot.go .b-tile img{animation:bRide .46s cubic-bezier(.16,1,.3,1) .16s both}
#boot.go .b-tile .sp{animation:bStreak .42s cubic-bezier(.2,.7,.3,1) both}
#boot.go .b-tile .sp:nth-of-type(1){animation-delay:.14s}#boot.go .b-tile .sp:nth-of-type(2){animation-delay:.2s}#boot.go .b-tile .sp:nth-of-type(3){animation-delay:.26s}
#boot.go .b-tile .gl{animation:bGlint .55s ease-in-out .58s both}
#boot.go .b-ring{animation:bRev .7s cubic-bezier(.2,.7,.3,1) .44s forwards}
#boot.go .b-name{animation:bName .5s cubic-bezier(.16,1,.3,1) .38s both}
#boot.out .b-stage{transition:transform .42s cubic-bezier(.55,0,.75,0),opacity .3s ease .08s;transform:scale(3.2);opacity:0}
#boot.out .b-name{transition:opacity .2s;opacity:0}
@keyframes bPop{0%{opacity:0;transform:scale(.25) rotate(-14deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bRide{0%{opacity:0;transform:translate(-150%,-50%) skewX(-28deg);filter:blur(5px)}100%{opacity:1;transform:translate(0,-50%);filter:none}}
@keyframes bStreak{0%{opacity:0;transform:translateX(0)}30%{opacity:1}100%{opacity:0;transform:translateX(190%)}}
@keyframes bGlint{to{left:130%}}
@keyframes bRev{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@keyframes bName{0%{opacity:0;letter-spacing:.8em;transform:translateY(8px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important;transition:none!important}#boot .b-name{opacity:1}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="b-stage"><i class="b-ring"></i><div class="b-tile"><i class="sp"></i><i class="sp"></i><i class="sp"></i><img src="icons/rwb-mark.webp" alt="" decoding="sync"><i class="gl"></i></div></div>
  <p class="b-name">Ronin Warriors of Bengal</p>
</div>
<script>/* start the intro once the RWB letters are ready (they're tiny); the app hides it when it has drawn, never before ~1 s */
(function () {
  var b = document.getElementById('boot'), rm = matchMedia('(prefers-reduced-motion: reduce)').matches, img = b.querySelector('img');
  var go = function () { if (!b.classList.contains('go')) b.classList.add('go'); };
  if (img.complete) go(); else { img.onload = img.onerror = go; setTimeout(go, 250); }
  window.INTRO_END = performance.now() + (rm ? 300 : 1050);
  b.addEventListener('click', function () { window.INTRO_END = 0; if (window.hideBootNow) window.hideBootNow(); });
})();</script>
<script>window.BOOT_T = performance.now();
/* if the app hasn't started after 15 s, show what went wrong (a screenshot of this tells us the cause) */
window.BOOT_ERR = [];
addEventListener('error', e => { BOOT_ERR.push((e.message || (e.target && (e.target.src || e.target.href)) || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
addEventListener('unhandledrejection', e => { BOOT_ERR.push('promise: ' + (e.reason && (e.reason.message || e.reason))); });
setTimeout(() => { const b = document.getElementById('boot'); if (!b || b.dataset.out) return;
  const ua = (navigator.userAgent.match(/(Chrome|Version)\/[\d.]+/g) || []).join(' ');
  const d = document.createElement('div'); d.style.cssText = 'max-width:330px;text-align:center;color:#d9d4cf;font:13px/1.5 system-ui,sans-serif;padding:0 16px';
  d.innerHTML = '<p style="margin:0 0 10px">The app is taking too long to start.</p><button style="padding:12px 22px;border:0;border-radius:99px;background:#e8662e;color:#fff;font-weight:600;font-size:15px" onclick="location.reload()">Try again</button><pre style="white-space:pre-wrap;text-align:left;margin-top:14px;color:#8f8a85;font-size:11px"></pre>';
  d.querySelector('pre').textContent = 'Details for RWB admins:\n' + (BOOT_ERR.join('\n') || 'no errors') + '\n' + ua + (window.androidBridge ? ' · Android app' : '') + (navigator.onLine ? '' : ' · OFFLINE');
  b.appendChild(d); }, 15000);
</script>
