<meta name="theme-color" content="#e9e6e1" id="theme-color">
<script>/* apply the saved theme before anything draws (light unless the rider chose otherwise) */
(function () { var t = 'light'; try { t = localStorage.getItem('rwb-theme') || 'light'; } catch (e) {}
  document.documentElement.dataset.theme = t;
  var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-color').content = dark ? '#121110' : '#e9e6e1'; })();</script>

<style>/* intro / loading screen "Nightfall": the screen starts in light-mode ivory, the logo opens like a shutter,
   then night falls (a dark circle grows from the logo), a warm headlight glow comes on, a thin ring draws round the logo,
   the name and motto arrive, and a small line shows it's loading. Quick reopens get a short version; tap skips it. */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;overflow:hidden;
  background:#ece8e2;color:#f3efe9;transition:opacity .5s ease,visibility .5s;-webkit-tap-highlight-color:transparent}
#boot.out{opacity:0;visibility:hidden}
#boot .night{position:absolute;inset:0;background:#0f0c0a;clip-path:circle(0% at 50% 50%)}
#boot .glow{position:absolute;inset:-25%;pointer-events:none;opacity:0;
  background:radial-gradient(42% 30% at 50% 48%,rgba(232,102,46,.62),transparent 70%),radial-gradient(60% 50% at 18% 8%,rgba(120,40,20,.45),transparent 70%),radial-gradient(60% 50% at 85% 95%,rgba(70,30,60,.5),transparent 70%)}
#boot > :not(.night):not(.glow):not(.bar){position:relative}
#boot .b-name{margin:0;font:600 13px/1 'Barlow',system-ui,sans-serif;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;white-space:nowrap;color:rgba(243,239,233,.9);text-align:center}
#boot .b-logo{position:relative;width:136px;height:136px}
#boot .b-logo img{width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 18px 50px -16px rgba(0,0,0,.45)}
#boot .b-logo svg{position:absolute;inset:-9px;width:calc(100% + 18px);height:calc(100% + 18px);transform:rotate(-90deg);overflow:visible}
#boot .b-logo circle{fill:none;stroke:#ee7a42;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:480;stroke-dashoffset:480}
#boot .b-motto{margin:0;display:flex;gap:.6em;font:500 13px/1 'Barlow',system-ui,sans-serif;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:rgba(243,239,233,.62)}
#boot .b-motto b{font-weight:600;color:#ee7a42}
#boot .b-motto > *{display:inline-block}
#boot .bar{position:absolute;bottom:calc(64px + max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px)));left:50%;width:64px;height:2px;margin-left:-32px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0}
#boot .bar i{position:absolute;inset:0;background:#ee7a42;transform:scaleX(0)}
/* full: the whole story (first open, or after 6 hours away) */
#boot.i-full .night{animation:bNight .75s cubic-bezier(.65,0,.35,1) .6s both}
#boot.i-full .glow{animation:bGlow 1s ease 1s both,bDrift 6s ease-in-out 2s infinite alternate}
#boot.i-full .b-logo img{animation:bIris .7s cubic-bezier(.16,1,.3,1) .1s both}
#boot.i-full .b-logo circle{animation:bRing 1s cubic-bezier(.65,0,.35,1) 1s both}
#boot.i-full .b-name{animation:bTrack 1s cubic-bezier(.16,1,.3,1) 1.15s both}
#boot.i-full .b-motto > *{animation:bRise .7s cubic-bezier(.16,1,.3,1) both}
#boot.i-full .b-motto > :nth-child(1){animation-delay:1.4s}#boot.i-full .b-motto > :nth-child(2){animation-delay:1.52s}#boot.i-full .b-motto > :nth-child(3){animation-delay:1.64s}
#boot.i-full .bar{animation:bFade .4s ease 1.8s both}#boot.i-full .bar i{animation:bLoad 1.4s cubic-bezier(.65,0,.35,1) 1.9s infinite}
/* quick: already night, everything just fades in */
#boot.i-quick .night{clip-path:none}
#boot.i-quick .glow{opacity:1;animation:bDrift 6s ease-in-out infinite alternate}
#boot.i-quick .b-logo circle{stroke-dashoffset:0;opacity:.35}
#boot.i-quick .b-logo,#boot.i-quick .b-name,#boot.i-quick .b-motto{animation:bFade .45s ease both}
#boot.i-quick .bar{animation:bFade .3s ease .6s both}#boot.i-quick .bar i{animation:bLoad 1.4s cubic-bezier(.65,0,.35,1) .6s infinite}
@keyframes bIris{from{clip-path:circle(0% at 50% 50%);transform:scale(1.12)}to{clip-path:circle(50% at 50% 50%);transform:none}}
@keyframes bNight{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(75% at 50% 50%)}}
@keyframes bGlow{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes bDrift{from{transform:translate3d(0,0,0) scale(1);filter:hue-rotate(0)}to{transform:translate3d(-3%,2%,0) scale(1.05);filter:hue-rotate(-25deg)}}
@keyframes bRing{0%{stroke-dashoffset:480;opacity:1}75%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.35}}
@keyframes bTrack{from{opacity:0;letter-spacing:.85em}to{opacity:1}}
@keyframes bRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes bFade{from{opacity:0}to{opacity:1}}
@keyframes bLoad{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}50.01%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
/* less motion: straight to the finished night screen */
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important}#boot .night{clip-path:none}#boot .glow{opacity:1}#boot .b-logo circle{stroke-dashoffset:0;opacity:.35}}
</style>

<body>
<div id="boot" aria-hidden="true">
  <i class="night"></i><i class="glow"></i>
  <p class="b-name">Ronin Warriors of Bengal</p>
  <div class="b-logo"><img src="icons/logo-384.png" alt=""><svg viewBox="0 0 154 154"><circle cx="77" cy="77" r="76"/></svg></div>
  <p class="b-motto"><span>Explore.</span><b>Evolve.</b><span>Inspire.</span></p>
  <span class="bar"><i></i></span>
</div>
<script>/* which intro: the full one every time the app opens; the quick one only for people who ask their phone for less motion. */
(function () {
  var b = document.getElementById('boot'), now = Date.now(), last = 0, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { last = Number(localStorage.getItem('rwb-intro-seen') || 0); } catch (e) {}
  var full = !rm;   /* the full intro on every open (members asked for it); tap skips it */
  b.className = full ? 'i-full' : 'i-quick';   /* not "full"/"quick": .quick is the app's quick-action row */
  if (full) { try { localStorage.setItem('rwb-intro-seen', String(now)); } catch (e) {} }
  window.INTRO_END = performance.now() + (full ? 2300 : 700);
  b.addEventListener('click', function () { window.INTRO_END = 0; if (window.hideBootNow) window.hideBootNow(); });
})();</script>
<script>window.BOOT_T = performance.now();
/* if the app hasn't started after 15 s, show what went wrong (a screenshot of this tells us the cause) */
window.BOOT_ERR = [];
addEventListener('error', e => { BOOT_ERR.push((e.message || (e.target && (e.target.src || e.target.href)) || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
addEventListener('unhandledrejection', e => { BOOT_ERR.push('promise: ' + (e.reason && (e.reason.message || e.reason))); });
setTimeout(() => { const b = document.getElementById('boot'); if (!b || b.dataset.out) return;
  const ua = (navigator.userAgent.match(/(Chrome|Version)\/[\d.]+/g) || []).join(' ');
  const d = document.createElement('div'); d.style.cssText = 'max-width:330px;text-align:center;color:#d9d4cf;font:13px/1.5 system-ui,sans-serif;padding:0 16px';
  d.innerHTML = '<p style="margin:0 0 10px">The app is taking too long to start.</p><button style="padding:12px 22px;border:0;border-radius:99px;background:#e8662e;color:#fff;font-weight:600;font-size:15px" onclick="location.reload()">Try again</button><pre style="white-space:pre-wrap;text-align:left;margin-top:14px;color:#8f8a85;font-size:11px"></pre>';
  d.querySelector('pre').textContent = 'Details for RWB admins:\n' + (BOOT_ERR.join('\n') || 'no errors') + '\n' + ua + (window.androidBridge ? ' · Android app' : '') + (navigator.onLine ? '' : ' · OFFLINE');
  b.appendChild(d); }, 15000);
</script>
