<script>/* apply the saved theme before anything draws (light unless the rider chose otherwise) */
(function () { var t = 'light'; try { t = localStorage.getItem('rwb-theme') || 'light'; } catch (e) {}
  document.documentElement.dataset.theme = t;
  var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-color').content = dark ? '#121110' : '#f7f7f5'; })();</script>

<style>/* intro / loading screen: calm and premium. The background slowly shifts colour, the logo fades and settles in,
   "Ronin Warriors of Bengal" above it, the motto below. Tap to skip; still for people who ask for less motion. */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;overflow:hidden;
  background:#0f0c0a;color:#f3efe9;transition:opacity .5s ease,visibility .5s;-webkit-tap-highlight-color:transparent}
#boot.out{opacity:0;visibility:hidden}
#boot .glow{position:absolute;inset:-25%;pointer-events:none;
  background:radial-gradient(55% 40% at 50% 46%,rgba(214,92,36,.55),transparent 70%),radial-gradient(60% 50% at 20% 10%,rgba(120,40,20,.45),transparent 70%),radial-gradient(60% 50% at 85% 95%,rgba(70,30,60,.5),transparent 70%);
  animation:bHue 6s ease-in-out infinite alternate}
#boot > :not(.glow){position:relative}
#boot .b-name{margin:0;font:600 13px/1 'Barlow',system-ui,sans-serif;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:rgba(243,239,233,.85);text-align:center}
#boot .b-logo{width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 70px -18px rgba(214,92,36,.7)}
#boot .b-motto{margin:0;font:500 13px/1 'Barlow',system-ui,sans-serif;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:rgba(243,239,233,.6)}
#boot .b-motto b{font-weight:600;color:#ee7a42}
#boot .skip{position:absolute;bottom:calc(22px + max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px)));font:500 11px/1 system-ui,sans-serif;letter-spacing:.12em;color:rgba(255,255,255,.28)}
#boot.i-full .b-logo{animation:bLogo 1.3s cubic-bezier(.16,1,.3,1) .1s both}
#boot.i-full .b-name{animation:bUp 1s cubic-bezier(.16,1,.3,1) .45s both}
#boot.i-full .b-motto{animation:bUp 1s cubic-bezier(.16,1,.3,1) .75s both}
#boot.i-quick .b-logo,#boot.i-quick .b-name,#boot.i-quick .b-motto{animation:bFade .5s ease both}
@keyframes bLogo{from{opacity:0;transform:scale(.82);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes bUp{from{opacity:0;transform:translateY(8px);letter-spacing:.6em}to{opacity:1;transform:none}}
@keyframes bFade{from{opacity:0}to{opacity:1}}
@keyframes bHue{0%{transform:translate3d(0,0,0) scale(1);filter:hue-rotate(0deg)}50%{transform:translate3d(3%,-2%,0) scale(1.06)}100%{transform:translate3d(-3%,2%,0) scale(1.02);filter:hue-rotate(-28deg)}}
@media (prefers-reduced-motion:reduce){#boot *{animation:none!important}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <i class="glow"></i>
  <p class="b-name">Ronin Warriors of Bengal</p>
  <img class="b-logo" src="icons/logo-384.png" alt="">
  <p class="b-motto">Explore. <b>Evolve.</b> Inspire.</p>
  <span class="skip">Tap to skip</span>
</div>
<script>/* which intro: full on the first open and after 6 hours away, otherwise a quick one. */
(function () {
  var b = document.getElementById('boot'), now = Date.now(), last = 0, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try { last = Number(localStorage.getItem('rwb-intro-seen') || 0); } catch (e) {}
  var full = !rm && now - last > 6 * 36e5;
  b.className = full ? 'i-full' : 'i-quick';   /* not "full"/"quick": .quick is the app's quick-action row */
  if (full) { try { localStorage.setItem('rwb-intro-seen', String(now)); } catch (e) {} }
  window.INTRO_END = performance.now() + (full ? 1900 : 700);
  b.addEventListener('click', function () { window.INTRO_END = 0; if (window.hideBootNow) window.hideBootNow(); });
})();</script>
<script>window.BOOT_T = performance.now();
/* if the app hasn't started after 15 s, show what went wrong (a screenshot of this tells us the cause) */
window.BOOT_ERR = [];
addEventListener('error', e => { BOOT_ERR.push((e.message || (e.target && (e.target.src || e.target.href)) || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
addEventListener('unhandledrejection', e => { BOOT_ERR.push('promise: ' + (e.reason && (e.reason.message || e.reason))); });
setTimeout(() => { const b = document.getElementById('boot'); if (!b || b.dataset.out) return;
  const ua = (navigator.userAgent.match(/(Chrome|Version)\/[\d.]+/g) || []).join(' ');
  const d = document.createElement('div'); d.style.cssText = 'max-width:330px;text-align:center;color:#d9d4cf;font:13px/1.5 system-ui,sans-serif;padding:0 16px';
  d.innerHTML = '<p style="margin:0 0 10px">The app is taking too long to start.</p><button style="padding:12px 22px;border:0;border-radius:99px;background:#e8662e;color:#fff;font-weight:600;font-size:15px" onclick="location.reload()">Try again</button><pre style="white-space:pre-wrap;text-align:left;margin-top:14px;color:#8f8a85;font-size:11px"></pre>';
  d.querySelector('pre').textContent = 'Details for RWB admins:\n' + (BOOT_ERR.join('\n') || 'no errors') + '\n' + ua + (window.androidBridge ? ' · Android app' : '') + (navigator.onLine ? '' : ' · OFFLINE');
  b.appendChild(d); }, 15000);
</script>
