<style>
:root{--bg:#f7f7f5;--surface:#fff;--ink:#14120f;--muted:#625f5a;--line:#d9d7d2;--accent:#d4501a;--on:#fff;--bad:#b3372b}
@media (prefers-color-scheme:dark){:root{--bg:#12100e;--surface:#1c1a17;--ink:#f2efea;--muted:#a8a29a;--line:#3a3530;--accent:#ee6c33;--on:#1a0e07;--bad:#f08072;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:var(--bg);color:var(--ink);font:400 1rem/1.6 'Barlow',system-ui,sans-serif}
main{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2rem 1.5rem;display:grid;gap:1rem;text-align:center}
img{width:72px;height:72px;border-radius:50%;margin:0 auto}
h1{margin:0;font:800 2.2rem/1 'Barlow Condensed','Arial Narrow',sans-serif;font-style:italic;text-transform:uppercase}
p{margin:0;color:var(--muted)}
form{display:grid;gap:.75rem;text-align:left}
label{font-weight:500;font-size:.95rem}
input[type=password],input[type=text]{width:100%;font:inherit;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:.3rem}
.show{display:flex;gap:.5rem;align-items:center;font-size:.9rem;color:var(--muted)}
button{font:600 1rem 'Barlow',sans-serif;border:2px solid var(--accent);background:var(--accent);color:var(--on);border-radius:999px;padding:.7rem 1rem;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-weight:500;min-height:1.5em;font-size:.95rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="assets/logo.png" alt="" width="72" height="72">
  <h1>Team guide</h1>
  <p>For RWB admins and coordinators. Enter the team password to continue.</p>
  <form id="f">
    <label for="pw">Password<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
    <label class="show"><input type="checkbox" id="sh"> Show password</label>
    <button id="go" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const data = b64(P), salt = data.slice(0, 16), iv = data.slice(16, 28), ct = data.slice(28);
const $ = id => document.getElementById(id);
const decrypt = key => crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct).then(b => new TextDecoder().decode(b));
const show = html => { document.open(); document.write(html); document.close(); };
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
const secure = !!(window.crypto && crypto.subtle);

$('sh').addEventListener('change', e => { $('pw').type = e.target.checked ? 'text' : 'password'; });
$('f').addEventListener('submit', async e => {
  e.preventDefault(); if (!secure) return;
  $('go').disabled = true; $('go').textContent = 'Checking…'; $('err').textContent = '';

    const key = await keyFromPassword($('pw').value), html = await decrypt(key);
    try { sessionStorage.setItem('rwb-guide-key', btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key))))); } catch {}

    $('err').textContent = 'That password is not right. Check it and try again.';

});
/* stay unlocked while this tab is open */
const resume = async () => {
  if (!secure) return;
  try {
    const raw = sessionStorage.getItem('rwb-guide-key'); if (!raw) return;
    const key = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']);
