<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RWB tutorial</title>
<style>
:root{--o:#e8662e;--o2:#d4501a;--ink:#0e0d0c;--paper:#f6f4f1;--muted:#a49d95}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0e0d0c}
body{font:500 34px/1.3 'Barlow',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 60% at 20% 0%,#3a1e10 0%,#151210 48%,#0e0d0c 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(10px)}
.g1{width:900px;height:900px;left:-300px;top:-300px;background:radial-gradient(closest-side,rgba(232,102,46,.28),transparent)}
.g2{width:900px;height:900px;right:-380px;bottom:120px;background:radial-gradient(closest-side,rgba(120,90,220,.16),transparent)}
.top{position:absolute;left:64px;right:64px;top:64px;display:flex;align-items:center;gap:20px}
.top img{width:84px;height:84px;border-radius:50%}
.top .brand{font:800 40px/1 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase}
.top .brand small{display:block;font:600 26px/1.2 'Barlow';letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:6px}
.pill{margin-left:auto;font:700 28px/1 'Barlow';padding:14px 24px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.prog{position:absolute;left:64px;right:64px;top:180px;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--o2),#f59a5c);border-radius:9px}
.cap{position:absolute;left:64px;right:64px;top:226px;height:380px}
.cap .step{font:800 30px/1 'Barlow';letter-spacing:.14em;color:var(--o);text-transform:uppercase}
.cap h1{font:800 88px/.95 'Barlow Condensed';text-transform:uppercase;margin-top:18px;letter-spacing:.005em}
.cap p{font:500 38px/1.3 'Barlow';color:#d8d2cb;margin-top:22px;max-width:30ch}
.cap p b{color:#fff}
.cap p .warn{color:#f6b26b}
/* phone */
.phone{position:absolute;left:50%;top:640px;width:612px;height:1300px;margin-left:-306px;border-radius:84px;background:#1d1b1a;box-shadow:0 0 0 3px #3a3633,0 40px 90px -20px rgba(0,0,0,.9),0 0 120px -30px rgba(232,102,46,.4)}
.screen{position:absolute;left:18px;top:18px;width:390px;height:844px;transform-origin:0 0;transform:scale(1.4769);border-radius:44px;overflow:hidden;background:#fff}
.layer{position:absolute;inset:0;opacity:0}
.finger{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.55);border:4px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;z-index:20;pointer-events:none}
.ripple{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid var(--o);opacity:0;z-index:19}
.hl{position:absolute;border:3px solid var(--o);border-radius:14px;box-shadow:0 0 0 6px rgba(232,102,46,.25);opacity:0;z-index:18}
/* intro / outro cards */
.card{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:0 90px;opacity:0}
.card img.logo{width:300px;height:300px;border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.06),0 30px 80px -10px rgba(232,102,46,.55)}
.card h2{font:800 120px/.92 'Barlow Condensed';text-transform:uppercase;margin-top:60px}
.card h2 em{font-style:normal;color:var(--o)}
.card p{font:500 44px/1.3 'Barlow';color:#d8d2cb;margin-top:30px;max-width:22ch}
.card .tag{margin-top:50px;font:700 34px/1 'Barlow';padding:20px 34px;border-radius:99px;background:var(--o);color:#fff}
.check{width:220px;height:220px;border-radius:50%;background:#1f9d55;display:grid;place-items:center;font:800 130px/1 'Barlow';box-shadow:0 30px 80px -10px rgba(31,157,85,.6)}
/* ---------- drawn phone UI (390 x 844 space) ---------- */
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font:600 15px/1 -apple-system,'Inter',sans-serif;color:#111}
.sb.dark{color:#fff}
.sb i{font-style:normal;letter-spacing:1px}
.ui{font-family:'Inter','Roboto',sans-serif;color:#1c1b1f}
.abar{margin:6px 12px;height:44px;border-radius:22px;background:#eef0f4;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;color:#333}
.abar .lock{width:14px;height:14px;border-radius:3px;border:2px solid #666}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:26px 24px 34px}
.dlg{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);background:#f3eef6;border-radius:28px;padding:26px 24px 18px;color:#1c1b1f}
.dlg h3{font:600 21px/1.3 'Inter';margin-bottom:12px}
.dlg p{font:400 15px/1.5 'Inter';color:#45444a}
.dlg .acts{display:flex;justify-content:flex-end;gap:26px;margin-top:22px;font:600 15px 'Inter';color:#6750a4}
.ios-dlg{position:absolute;left:52px;right:52px;top:50%;transform:translateY(-50%);background:rgba(242,242,247,.97);border-radius:16px;text-align:center;overflow:hidden;color:#000}
.ios-dlg h3{font:600 17px/1.3 -apple-system,'Inter';padding:20px 16px 4px}
.ios-dlg p{font:400 13px/1.4 'Inter';padding:0 16px 18px;color:#333}
.ios-dlg .acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #c8c7cc}
.ios-dlg .acts span{padding:12px 0;font:400 17px 'Inter';color:#0a7aff}
.ios-dlg .acts span + span{border-left:1px solid #c8c7cc;font-weight:600}
.web{position:absolute;left:0;right:0;top:100px;bottom:0;overflow:hidden}
.web.full{top:0}
.web img{width:390px;display:block}
.snack{position:absolute;left:14px;right:14px;bottom:24px;background:#313033;color:#f4eff4;border-radius:8px;padding:16px 18px;display:flex;justify-content:space-between;font:400 15px 'Inter'}
.snack b{color:#d0bcff;font-weight:600}
.home{position:absolute;inset:0;background:linear-gradient(160deg,#4a6fa5,#9b5c8f 55%,#e08a4f)}
.grid{position:absolute;left:26px;right:26px;top:80px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px 0;justify-items:center}
.app{display:grid;justify-items:center;gap:6px;font:500 12px 'Inter';color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.app i{width:62px;height:62px;border-radius:15px;display:block;background:rgba(255,255,255,.3)}
.app img{width:62px;height:62px;border-radius:15px;display:block;background:#fff}
.dock{position:absolute;left:14px;right:14px;bottom:24px;height:96px;border-radius:30px;background:rgba(255,255,255,.28);display:flex;justify-content:space-around;align-items:center}
.compass{width:62px;height:62px;border-radius:15px;background:linear-gradient(#fff,#e9eef5);display:grid;place-items:center}
.compass b{width:48px;height:48px;border-radius:50%;background:conic-gradient(#1e88ff,#22c1ff,#1e88ff);position:relative}
.compass b::after{content:"";position:absolute;left:21px;top:6px;width:6px;height:36px;background:linear-gradient(#ff3b30 50%,#fff 50%);transform:rotate(45deg);border-radius:3px}
.chromebar{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(249,249,249,.97);border-top:1px solid #ddd}
.chromebar .url{margin:8px 14px;height:38px;border-radius:12px;background:#e4e4e8;display:flex;align-items:center;justify-content:center;font:500 15px 'Inter';color:#111}
.chromebar .tools{display:flex;justify-content:space-around;color:#0a7aff;font:400 22px 'Inter';margin-top:2px}
.share-ico{width:22px;height:26px;position:relative;display:inline-block}
.share-ico::before{content:"";position:absolute;left:2px;right:2px;bottom:0;height:16px;border:2.4px solid #0a7aff;border-top:0;border-radius:0 0 3px 3px}
.share-ico::after{content:"↑";position:absolute;left:0;right:0;top:-8px;text-align:center;font:700 20px 'Inter';color:#0a7aff}
.ios-sheet{position:absolute;left:8px;right:8px;bottom:8px;top:240px;background:#f2f2f7;border-radius:14px;padding:14px;color:#000}
.ios-sheet .head{display:flex;gap:12px;align-items:center;padding:4px 4px 14px;border-bottom:1px solid #d8d8dd}
.ios-sheet .head img{width:44px;height:44px;border-radius:10px}
.ios-sheet .rows{margin-top:14px;background:#fff;border-radius:12px;overflow:hidden}
.ios-sheet .rows div{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font:400 16px 'Inter';border-top:1px solid #e5e5ea}
.ios-sheet .rows div:first-child{border-top:0}
.ios-sheet .rows span.ic{font-size:17px;color:#333}
.kbd{position:absolute;left:0;right:0;bottom:0;height:290px;background:#d1d4db;display:grid;grid-template-rows:repeat(4,1fr);gap:10px;padding:12px 4px 40px}
.kbd div{display:flex;justify-content:center;gap:6px}
.kbd span{width:32px;background:#fff;border-radius:6px;box-shadow:0 1px 0 #888;display:grid;place-items:center;font:400 20px 'Inter';color:#000}
.kbd span.go{width:88px;background:#0a7aff;color:#fff;font-size:16px}
.toggle{width:52px;height:32px;border-radius:16px;background:#79747e;position:relative}
.toggle::after{content:"";position:absolute;left:6px;top:6px;width:20px;height:20px;border-radius:50%;background:#fff}
.toggle.on{background:#6750a4}.toggle.on::after{left:26px}
.acct{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid #eee;font:400 15px 'Inter'}
.acct i{width:40px;height:40px;border-radius:50%;background:#7b5cf0;color:#fff;display:grid;place-items:center;font:600 16px 'Inter';font-style:normal}
</style></head><body>
<div id="v"><i class="glow g1"></i><i class="glow g2"></i>
  <div class="top"><img src="img/logo-384.png" alt=""><div class="brand">RWB App<small>How to</small></div><span class="pill" id="pill"></span></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="cap" id="cap"><div class="step" id="cstep"></div><h1 id="ctitle"></h1><p id="csub"></p></div>
  <div class="phone" id="phone"><div class="screen" id="screen"></div></div>
  <div id="cards"></div>
</div>
<script>
const P = new URLSearchParams(location.search).get('v') || 'android';
const ANDROID = P === 'android';
const SB = (dark) => `<div class="sb${dark ? ' dark' : ''}"><span>${ANDROID ? '10:30' : '10:30'}</span><i>${ANDROID ? '▼ ◢ ▮' : '▂▄▆ ᯤ ▮'}</i></div>`;
const img = (f, top = 0) => `<img src="img/${f}" style="margin-top:${-top}px">`;
const ACCT = `<div class="dim"></div><div class="sheet ui"><p style="font:600 19px Inter;margin-bottom:6px">Choose an account</p><p style="font:400 14px Inter;color:#555;margin-bottom:14px">to continue to roninwb.in</p>
   <div class="acct"><i>W</i><span><b style="font-weight:600">Warrior Rider</b><br><span style="color:#666">your.name@gmail.com</span></span></div>
   <div class="acct"><i style="background:#e0e0e0;color:#555">+</i><span>Use another account</span></div></div>`;
/* ---------- Android screens ---------- */
const siteA = `${SB()}<div class="abar"><span class="lock"></span>roninwb.in</div>
  <div class="web" style="top:100px;background:#111;color:#fff;padding:34px 24px">
    <p style="font:700 13px Inter;letter-spacing:.12em;color:#e8662e">RWB APP</p>
    <p style="font:800 44px/1 'Barlow Condensed';text-transform:uppercase;margin-top:10px">Get the RWB App</p>
    <p style="font:400 15px/1.5 Inter;color:#ccc;margin-top:14px">Service records, mileage tracker, RWB Motomart, events and ride news. Free for every warrior.</p>
    <div style="margin-top:26px;display:flex;gap:10px"><span style="background:#d4501a;border-radius:99px;padding:14px 22px;font:600 16px Inter">Download Now</span><span style="border:1px solid #555;border-radius:99px;padding:14px 18px;font:500 15px Inter">Not a member yet?</span></div>
    <img src="img/home.png" style="width:220px;margin:34px auto 0;border-radius:20px;border:4px solid #333"></div>`;
const warnA = siteA + `<div class="dim"></div><div class="sheet ui"><p style="font:600 18px/1.35 Inter">This type of file can harm your device</p><p style="font:400 15px/1.5 Inter;color:#555;margin-top:10px">Do you want to keep RWB-App.apk anyway?</p>
   <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:22px"><span style="padding:12px 18px;font:600 15px Inter;color:#1a73e8">Cancel</span><span style="padding:12px 18px;border-radius:99px;background:#1a73e8;color:#fff;font:600 15px Inter">Download anyway</span></div></div>`;
const doneA = siteA + `<div class="snack"><span>RWB-App.apk downloaded</span><b>Open</b></div>`;
const blockA = siteA + `<div class="dim"></div><div class="dlg"><h3>Install blocked</h3><p>For your security, your phone currently isn't allowed to install unknown apps from this source. You can change this in Settings.</p><div class="acts"><span>Cancel</span><span>Settings</span></div></div>`;
const setA = on => `${SB()}<div class="ui" style="padding:16px 22px"><p style="font:400 24px Inter;margin:6px 0 30px">←</p><p style="font:400 30px/1.2 Inter;margin-bottom:26px">Install unknown apps</p>
   <div style="display:flex;align-items:center;gap:14px;margin-bottom:28px"><span style="width:44px;height:44px;border-radius:50%;background:conic-gradient(#ea4335 0 33%,#fbbc04 0 66%,#34a853 0);display:block"></span><span style="font:500 18px Inter">Your browser</span></div>
   <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-top:1px solid #e5e5e5"><span style="font:400 17px Inter">Allow from this source</span><span class="toggle${on ? ' on' : ''}"></span></div>
   <p style="font:400 13px/1.5 Inter;color:#666;margin-top:10px">Your phone and personal data are more vulnerable to attack by unknown apps.</p></div>`;
const instA = (stage) => `${SB()}<div style="position:absolute;inset:44px 0 0;background:#fdf8fd"></div><div class="dim" style="background:rgba(0,0,0,.25)"></div>
   <div class="dlg" style="text-align:left"><div style="display:flex;align-items:center;gap:14px;margin-bottom:16px"><img src="img/logo-384.png" style="width:52px;height:52px;border-radius:50%"><b style="font:600 20px Inter">RWB</b></div>
   <p>${stage === 0 ? 'Do you want to install this app?' : stage === 1 ? 'Installing…' : 'App installed.'}</p>
   ${stage === 1 ? '<div style="height:4px;background:#e8def8;border-radius:4px;margin-top:18px;overflow:hidden"><div style="width:60%;height:100%;background:#6750a4"></div></div>' : ''}
   <div class="acts">${stage === 0 ? '<span>Cancel</span><span>Install</span>' : stage === 2 ? '<span>Done</span><span>Open</span>' : '<span style="opacity:0">.</span>'}</div></div>`;
const signin = (bars) => `${SB()}<div class="web${bars ? '' : ' full'}" style="${bars ? 'top:44px' : ''}">${img('signin.png', 44)}</div>`;
const homeShot = `${SB()}<div class="web full">${img('home.png', 0)}</div>`;
const permA = homeShot + `<div class="dim"></div><div class="dlg" style="text-align:center"><p style="font:400 28px Inter;color:#6750a4;margin-bottom:10px">🔔</p><h3 style="font:400 20px/1.35 Inter">Allow <b>RWB</b> to send you notifications?</h3>
   <div style="display:grid;gap:8px;margin-top:20px"><span style="padding:13px;border-radius:99px;background:#6750a4;color:#fff;font:600 15px Inter">Allow</span><span style="padding:13px;border-radius:99px;background:#e8def8;color:#1d192b;font:600 15px Inter">Don't allow</span></div></div>`;
/* ---------- iPhone screens ---------- */
const appsGrid = (withRwb) => `<div class="home"></div>${SB(true)}<div class="grid">${['Photos', 'Camera', 'Mail', 'Clock', 'Maps', 'Weather', 'Notes', 'Settings', 'Music', 'Wallet', 'Health', 'Files'].map((n, i) => `<span class="app"><i style="background:hsl(${i * 31},55%,62%)"></i>${n}</span>`).join('')}${withRwb ? `<span class="app" id="rwbicon"><img src="img/icon-192.png">RWB</span>` : ''}</div>
   <div class="dock"><span class="compass"><b></b></span><span class="app"><i style="background:#34c759"></i></span><span class="app"><i style="background:#0a7aff"></i></span><span class="app"><i style="background:#ff9500"></i></span></div>`;
const chatI = `${SB()}<div class="ui" style="position:absolute;inset:44px 0 0;background:#efe7de"><div style="background:#f6f6f6;padding:14px 18px;font:600 17px Inter;border-bottom:1px solid #ddd">RWB Members</div>
   <div style="margin:24px 14px 0 80px;background:#d9fdd3;border-radius:12px;padding:12px 14px;font:400 15px/1.45 Inter">Install the RWB App 👇<br><span style="color:#1a73e8;text-decoration:underline">roninwb.in/app</span></div>
   <div style="margin:18px auto 0;width:300px;background:#fff;border-radius:14px;padding:16px;font:500 14px/1.45 Inter;color:#b3261e;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.12)">✕ Tapping the link opens it <b>inside WhatsApp</b>, where you can't add it to your Home Screen.</div></div>`;
const safari = (typed, kbd) => `${SB()}<div class="ui" style="position:absolute;inset:44px 0 0;background:#fff"><div style="padding:40px 26px;color:#999;font:400 15px Inter;text-align:center">Start Page</div></div>
   <div class="chromebar" style="bottom:${kbd ? 290 : 0}px;height:${kbd ? 56 : 84}px"><div class="url" style="justify-content:${typed !== null ? 'flex-start' : 'center'};padding:0 14px">${typed !== null ? typed + '<span style="width:2px;height:20px;background:#0a7aff;margin-left:2px"></span>' : 'Search or enter website'}</div></div>
   ${kbd ? `<div class="kbd"><div>${'qwertyuiop'.split('').map(c => `<span>${c}</span>`).join('')}</div><div>${'asdfghjkl'.split('').map(c => `<span>${c}</span>`).join('')}</div><div>${'zxcvbnm'.split('').map(c => `<span>${c}</span>`).join('')}</div><div><span style="width:200px">space</span><span class="go">go</span></div></div>` : ''}`;
const safariPage = `${SB()}<div class="web" style="top:44px;bottom:84px">${img('signin.png', 44)}</div>
   <div class="chromebar"><div class="url" style="font-size:13px;height:30px;margin:6px 60px">roninwb.in</div><div class="tools"><span>‹</span><span style="color:#bbb">›</span><span class="share-ico" id="shr"></span><span>☐</span><span>⧉</span></div></div>`;
const shareSheet = (scrolled) => safariPage + `<div class="dim" style="background:rgba(0,0,0,.25)"></div><div class="ios-sheet ui"><div class="head"><img src="img/icon-192.png"><span><b style="font-weight:600">RWB App</b><br><span style="color:#888;font-size:13px">roninwb.in</span></span></div>
   <div class="rows">${(scrolled ? ['Add to Favourites', 'Find on Page', 'Add to Home Screen', 'Markup', 'Print'] : ['Copy', 'Add to Reading List', 'Add Bookmark', 'Add to Favourites', 'Find on Page'])
     .map(r => `<div${r === 'Add to Home Screen' ? ' style="background:#fff4ec;font-weight:600"' : ''}><span>${r}</span><span class="ic">${r === 'Add to Home Screen' ? '⊞' : r === 'Copy' ? '⧉' : '○'}</span></div>`).join('')}</div></div>`;
const addHome = `${SB()}<div class="ui" style="position:absolute;inset:44px 0 0;background:#f2f2f7"><div style="display:flex;justify-content:space-between;padding:16px 18px;font:400 17px Inter"><span style="color:#0a7aff">Cancel</span><b style="font-weight:600">Add to Home Screen</b><span style="color:#0a7aff;font-weight:600">Add</span></div>
   <div style="margin:18px 16px;background:#fff;border-radius:12px;padding:16px;display:flex;gap:16px;align-items:center"><img src="img/icon-192.png" style="width:62px;height:62px;border-radius:14px"><div style="flex:1"><p style="font:400 17px Inter;border-bottom:1px solid #e5e5ea;padding-bottom:10px">RWB</p><p style="font:400 14px Inter;color:#8e8e93;padding-top:10px">roninwb.in</p></div></div>
   <p style="font:400 13px/1.45 Inter;color:#6c6c70;margin:0 30px">An icon will be added to your Home Screen so you can quickly access this website.</p></div>`;
const permI = homeShot + `<div class="dim" style="background:rgba(0,0,0,.3)"></div><div class="ios-dlg"><h3>“RWB” Would Like to Send You Notifications</h3><p>Notifications may include alerts, sounds and icon badges.</p><div class="acts"><span>Don't Allow</span><span>Allow</span></div></div>`;

/* ---------- the scripts ---------- */
const T = (n, of, title, sub) => ({ step: n ? `Step ${n} of ${of}` : '', title, sub });
const A = [
  { dur: 3.6, card: `<img class="logo" src="img/logo-384.png"><h2>Install on <em>Android</em></h2><p>The RWB App in about a minute. Free for every warrior.</p><span class="tag">roninwb.in</span>` },
  { dur: 5.2, cap: T(1, 7, 'Open roninwb.in', 'In <b>Chrome</b>, go to <b>roninwb.in</b>, scroll to <b>Get the RWB App</b> and tap <b>Download Now</b>.'), beats: [{ at: 0, s: siteA, tap: [104, 346], tapAt: 3.4 }] },
