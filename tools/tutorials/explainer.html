<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RWB member management</title>
<style>
:root{--o:#e8662e;--o2:#d4501a;--muted:#a49d95;--form:#8b6cf6;--sheet:#22a565;--db:#3d86f0;--app:#e8662e;--bad:#ef5b4c;--warn:#f2a33a;--ok:#2fbf71}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0e0d0c}
body{font:500 34px/1.3 'Barlow',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(120% 60% at 20% 0%,#3a1e10 0%,#151210 48%,#0e0d0c 100%)}
.glow{position:absolute;border-radius:50%}
.g1{width:900px;height:900px;left:-300px;top:-300px;background:radial-gradient(closest-side,rgba(232,102,46,.26),transparent)}
.g2{width:900px;height:900px;right:-380px;bottom:120px;background:radial-gradient(closest-side,rgba(80,120,240,.16),transparent)}
.topbar{position:absolute;left:64px;right:64px;top:64px;display:flex;align-items:center;gap:20px;z-index:5}
.topbar img{width:84px;height:84px;border-radius:50%}
.brand{font:800 40px/1 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:600 26px/1.2 'Barlow';letter-spacing:.04em;text-transform:none;color:var(--muted);margin-top:6px}
.pill{margin-left:auto;font:700 28px/1 'Barlow';padding:14px 24px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.prog{position:absolute;left:64px;right:64px;top:180px;height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;z-index:5}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--o2),#f59a5c);border-radius:9px}
.chap{position:absolute;left:64px;right:64px;top:200px;display:flex;justify-content:space-between;font:700 22px 'Barlow';color:var(--muted);letter-spacing:.06em;text-transform:uppercase;z-index:5}
.scene{position:absolute;inset:0;opacity:0}
.cap{position:absolute;left:64px;right:64px;top:250px}
.cap .step{font:800 30px/1 'Barlow';letter-spacing:.14em;color:var(--o);text-transform:uppercase}
.cap h1{font:800 84px/.95 'Barlow Condensed';text-transform:uppercase;margin-top:16px}
.cap p{font:500 37px/1.32 'Barlow';color:#d8d2cb;margin-top:20px}
.cap p b{color:#fff}
/* motion-graphic area */
.mg{position:absolute;left:0;right:0;top:600px;height:1300px}
.mg svg{position:absolute;inset:0;width:1080px;height:1300px;overflow:visible}
.node{position:absolute;display:grid;justify-items:center;text-align:center;gap:6px;padding:26px 20px 24px;border-radius:30px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.node .ico{font-size:66px;line-height:1}
.node b{font:800 40px/1.05 'Barlow Condensed';text-transform:uppercase;letter-spacing:.02em}
.node small{font:500 26px/1.25 'Barlow';color:#cfc8c0}
.node.form{border-color:var(--form);background:color-mix(in srgb,var(--form) 14%,transparent)}
.node.sheet{border-color:var(--sheet);background:color-mix(in srgb,var(--sheet) 14%,transparent)}
.node.db{border-color:var(--db);background:color-mix(in srgb,var(--db) 16%,transparent)}
.node.app{border-color:var(--app);background:color-mix(in srgb,var(--app) 14%,transparent)}
.node.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.lbl{position:absolute;font:700 25px/1.2 'Barlow';color:#fff;background:rgba(0,0,0,.55);padding:8px 16px;border-radius:99px;white-space:nowrap;border:1px solid rgba(255,255,255,.15)}
.steps{position:absolute;left:70px;right:70px;top:10px;display:grid;gap:22px}
.st{display:grid;grid-template-columns:96px 1fr;gap:24px;align-items:center;padding:22px 26px;border-radius:26px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12)}
.st .n{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;font-size:52px;background:rgba(255,255,255,.08)}
.st b{display:block;font:800 40px/1.05 'Barlow Condensed';text-transform:uppercase;letter-spacing:.02em}
.st span{display:block;font:500 29px/1.3 'Barlow';color:#d0c9c1;margin-top:6px}
.st.hl{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st.hlo{border-color:var(--o);background:color-mix(in srgb,var(--o) 13%,transparent)}
.st.hlb{border-color:var(--db);background:color-mix(in srgb,var(--db) 14%,transparent)}
.st.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.st span.tag,.tag{display:inline-block;margin-top:0;font:800 24px/1 'Barlow';padding:9px 16px;border-radius:99px;background:#1f9d55;color:#fff;vertical-align:middle;margin-left:10px;letter-spacing:.02em}
.tag.left{background:rgba(242,163,58,.25);color:#f6c278}.tag.removed{background:rgba(239,91,76,.25);color:#ff9d93}.tag.app{background:rgba(47,191,113,.2);color:#7fe0aa}
.box{position:absolute;border-radius:40px;border:3px dashed rgba(255,255,255,.25)}
.chipp{position:absolute;display:flex;align-items:center;gap:14px;padding:12px 20px 12px 12px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font:600 28px 'Barlow';white-space:nowrap}
.chipp i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:700 24px 'Barlow';font-style:normal;background:#2b2725;border:2px solid rgba(255,255,255,.2)}
.warnc{position:absolute;left:70px;right:70px;padding:26px 30px;border-radius:26px;display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center;font:500 31px/1.3 'Barlow';color:#ffe0dc;background:color-mix(in srgb,var(--bad) 16%,transparent);border:2px solid var(--bad)}
.warnc .i{font-size:56px}
.warnc b{color:#fff}
.okc{color:#d8ffe8;background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:var(--ok)}
table.cmp{position:absolute;left:50px;right:50px;top:0;border-collapse:separate;border-spacing:0 12px;font:500 27px/1.25 'Barlow'}
table.cmp th{font:800 30px/1.1 'Barlow Condensed';text-transform:uppercase;color:var(--muted);text-align:left;padding:0 16px 4px}
table.cmp td{padding:18px 16px;background:rgba(255,255,255,.06);vertical-align:middle}
table.cmp td:first-child{border-radius:18px 0 0 18px;font-weight:700;color:#fff;width:28%}
table.cmp td:last-child{border-radius:0 18px 18px 0}
table.cmp .y{color:#7fe0aa;font-weight:700}.cmp .x{color:#ff9d93;font-weight:700}.cmp .k{color:#9cc3ff;font-weight:700}
.roles{position:absolute;left:40px;right:40px;top:0;border-collapse:separate;border-spacing:0 10px;font:500 26px/1.2 'Barlow'}
.roles th{font:800 27px/1.05 'Barlow Condensed';text-transform:uppercase;color:#fff;padding:0 6px 6px;text-align:center}
.roles td{padding:16px 8px;background:rgba(255,255,255,.06);text-align:center;font-size:36px}
.roles td:first-child{text-align:left;font-size:27px;font-weight:600;border-radius:16px 0 0 16px;padding-left:20px;width:42%}
.roles td:last-child{border-radius:0 16px 16px 0}
.mini{position:absolute;left:310px;top:20px;width:460px;height:900px;border-radius:56px;background:#f4f1ec;border:10px solid #1d1b1a;box-shadow:0 0 0 3px #3a3633,0 40px 80px -20px rgba(0,0,0,.9);overflow:hidden;color:#111}
.mini .row{display:flex;align-items:center;gap:14px;margin:14px 18px;padding:16px;border-radius:20px;background:#fff;font:600 24px 'Barlow';box-shadow:0 6px 16px -10px rgba(0,0,0,.3)}
.mini .row i{width:50px;height:50px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font:700 19px 'Barlow';font-style:normal;flex:none}
.mini .row small{display:block;font:500 18px 'Barlow';color:#777}
.mini .nt{font:800 17px 'Barlow';background:#1f9d55;color:#fff;padding:5px 10px;border-radius:99px;margin-left:auto}
.mini .chips{display:flex;gap:10px;margin:22px 18px 6px;flex-wrap:wrap}
.mini .chips span{font:600 20px 'Barlow';padding:9px 16px;border-radius:99px;border:1px solid #ddd;background:#fff}
.mini .chips span.on{background:#d4501a;color:#fff;border-color:#d4501a}
.mini .hd{background:#f7f5f2;padding:26px 22px 10px;font:800 34px 'Barlow Condensed';text-transform:uppercase}
.wa{position:absolute;width:150px;height:150px;border-radius:40px;background:#1f9d55;display:grid;place-items:center;font-size:84px;box-shadow:0 20px 50px -15px rgba(31,157,85,.7)}
.pts{position:absolute;left:70px;right:70px;list-style:none;display:grid;gap:18px}
.pts li{display:grid;grid-template-columns:52px 1fr;gap:16px;font:500 32px/1.3 'Barlow';color:#e7e1da;align-items:start}
.pts li i{font-style:normal;font-size:40px;line-height:1.1}
.pts li b{color:#fff}
/* phone (app screens) */
.phone{position:absolute;left:50%;top:640px;width:612px;height:1300px;margin-left:-306px;border-radius:84px;background:#1d1b1a;box-shadow:0 0 0 3px #3a3633,0 40px 90px -20px rgba(0,0,0,.9),0 0 120px -30px rgba(232,102,46,.4)}
.screen{position:absolute;left:18px;top:18px;width:390px;height:844px;transform-origin:0 0;transform:scale(1.4769);border-radius:44px;overflow:hidden;background:#fff}
.layer{position:absolute;inset:0;opacity:0}
.layer img{width:390px;height:844px;display:block}
.finger{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.55);border:4px solid #fff;box-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;z-index:20}
.ripple{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid var(--o);opacity:0;z-index:19}
.card{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:0 90px}
.card img.logo{width:300px;height:300px;border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.06),0 30px 80px -10px rgba(232,102,46,.55)}
.card .kicker{font:800 34px/1 'Barlow';letter-spacing:.16em;color:var(--o);text-transform:uppercase;margin-top:56px}
.card h2{font:800 120px/.92 'Barlow Condensed';text-transform:uppercase;margin-top:18px}
.card h2 em{font-style:normal;color:var(--o)}
.card p{font:500 44px/1.3 'Barlow';color:#d8d2cb;margin-top:30px;max-width:22ch}
.card .tagx{margin-top:46px;font:700 32px/1 'Barlow';padding:20px 34px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.check{width:220px;height:220px;border-radius:50%;background:#1f9d55;display:grid;place-items:center;font:800 130px/1 'Barlow'}
.node{background:#191614}
.node.form{background:color-mix(in srgb,var(--form) 16%,#171412)}.node.sheet{background:color-mix(in srgb,var(--sheet) 16%,#171412)}
.node.db{background:color-mix(in srgb,var(--db) 18%,#171412)}.node.app{background:color-mix(in srgb,var(--app) 16%,#171412)}.node.bad{background:color-mix(in srgb,var(--bad) 16%,#171412)}
.node small strong{font:700 26px/1.25 'Barlow';color:#fff}
.mini .nt{white-space:nowrap}
</style></head><body>
<div id="v"><i class="glow g1"></i><i class="glow g2"></i>
  <div class="topbar"><img src="LOGO" alt=""><div class="brand">RWB App<small>For admins</small></div><span class="pill">Member management</span></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="chap"><span id="chap"></span><span id="chapn"></span></div>
  <div id="stage"></div>
</div>
<script>/*data*/</script>
<script>
const SHOTS = window.SHOTS || [], LOGO = window.LOGO;
document.querySelector('.topbar img').src = LOGO;
const cap = (step, title, sub) => `<div class="cap"><div class="step">${step}</div><h1>${title}</h1><p>${sub}</p></div>`;
const A = (t, fx = 'up', d = .55) => `data-a="${t}" data-fx="${fx}" data-d="${d}"`;
const node = (cls, x, y, w, ico, title, sub, t) => `<div class="node ${cls}" style="left:${x}px;top:${y}px;width:${w}px" ${A(t, 'pop')}><span class="ico">${ico}</span><b>${title}</b><small>${sub}</small></div>`;
const st = (cls, ico, title, sub, t) => `<div class="st ${cls}" ${A(t, 'left')}><span class="n">${ico}</span><div><b>${title}</b><span>${sub}</span></div></div>`;

/* ======================= the story ======================= */
const S = [];
S.push({ chap: '', dur: 4.2, html: `<div class="card"><img class="logo" src="${LOGO}"><p class="kicker">For RWB admins</p><h2>Member <em>manage&shy;ment</em></h2><p>How people join, how to find new members, and what really happens when you remove someone.</p><span class="tagx">About 4 minutes</span></div>` });

/* 1. where data lives */
S.push({ chap: '1 · The basics', dur: 15, html: cap('The basics', 'Where member data lives', 'Two lists, kept <b>in sync automatically</b>: your <b>contact sheet</b> and the app\'s <b>database</b>.') + `<div class="mg">
  <svg viewBox="0 0 1080 1300"><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>
    <path id="p1" class="draw" ${A(1.2, 'draw', .8)} d="M270 300 L270 470" stroke="#8b6cf6" stroke-width="7" fill="none" marker-end="url(#ah)"/>
    <path id="p2" class="draw" ${A(2.6, 'draw', .8)} d="M484 560 L596 560" stroke="#22a565" stroke-width="7" fill="none" marker-end="url(#ah)"/>
    <path id="p3" class="draw" ${A(3.4, 'draw', .8)} d="M596 640 L484 640" stroke="#3d86f0" stroke-width="7" fill="none" marker-end="url(#ah)"/>
    <path id="p4" class="draw" ${A(5.6, 'draw', .8)} d="M810 300 L810 470" stroke="#e8662e" stroke-width="7" fill="none" marker-end="url(#ah)"/>
    <path id="p5" class="draw" ${A(7.2, 'draw', .9)} d="M810 820 L810 930" stroke="#3d86f0" stroke-width="7" fill="none" marker-end="url(#ah)"/>
    <circle r="12" fill="#c6b6ff" data-path="p1" data-a="2" data-d="1.4" data-loop="1"/><circle r="12" fill="#8ff0b8" data-path="p2" data-a="3.4" data-d="1.2" data-loop="1"/>
    <circle r="12" fill="#a9ccff" data-path="p3" data-a="4.2" data-d="1.2" data-loop="1"/><circle r="12" fill="#ffc29f" data-path="p4" data-a="6.4" data-d="1.4" data-loop="1"/>
    <circle r="12" fill="#a9ccff" data-path="p5" data-a="8.1" data-d="1.2" data-loop="1"/></svg>
  ${node('form', 70, 40, 400, '📝', 'Join form', 'roninwb.in → Join us', .4)}
  ${node('app', 610, 40, 400, '📱', 'Join request', 'from inside the app', 4.8)}
  ${node('sheet', 70, 480, 410, '📊', 'Contact sheet', 'Google Sheet · admins only', 1.9)}
  ${node('db', 600, 480, 420, '🗄️', 'RWB database', 'the master list the app uses', 2.2)}
  ${node('app', 560, 940, 500, '👥', 'In the app', 'member list · birthdays · boards', 7.6)}
  <span class="lbl" style="left:300px;top:715px" ${A(3, 'fade')}>new form rows →</span>
  <span class="lbl" style="left:300px;top:770px" ${A(3.8, 'fade')}>← approvals · edits · removals</span>
  <ul class="pts" style="top:1000px;right:560px;left:70px"><li ${A(9, 'up')}><i>💡</i><span>The <b>database</b> decides who is a member in the app.</span></li></ul>
  <ul class="pts" style="top:1160px"><li ${A(10.5, 'up')}><i>📊</i><span>The <b>sheet</b> is your copy to read and export.</span></li></ul></div>` });

/* 2. database vs on the app */
S.push({ chap: '1 · The basics', dur: 16, html: cap('The basics', 'In the database vs on the app', 'Not everyone in RWB has installed the app, and that\'s fine.') + `<div class="mg">
  <div class="box" style="left:50px;top:10px;width:980px;height:700px;border-color:#3d86f0;background:rgba(61,134,240,.06)" ${A(.4, 'pop')}></div>
  <span class="lbl" style="left:80px;top:30px;background:#3d86f0" ${A(.7, 'fade')}>🗄️ In the database: every RWB member</span>
  <div class="box" style="left:520px;top:150px;width:470px;height:520px;border-color:#2fbf71;border-style:solid;background:rgba(47,191,113,.08)" ${A(2.6, 'pop')}></div>
  <span class="lbl" style="left:550px;top:170px;background:#1f9d55" ${A(2.9, 'fade')}>📱 Also on the app</span>
  ${['AS|Arjun', 'PD|Priya', 'KD|Kunal'].map((n, i) => `<div class="chipp" style="left:560px;top:${260 + i * 120}px" ${A(3.2 + i * .25, 'pop')}><i>${n.split('|')[0]}</i>${n.split('|')[1]} <span class="tag app">On app</span></div>`).join('')}
  ${['SP|Sourav', 'RB|Riya', 'TM|Tanmay', 'AK|Avik'].map((n, i) => `<div class="chipp" style="left:90px;top:${150 + i * 125}px" ${A(1.2 + i * .25, 'pop')}><i>${n.split('|')[0]}</i>${n.split('|')[1]}</div>`).join('')}
  <ul class="pts" style="top:760px">
    <li ${A(5.5)}><i>🗄️</i><span><b>Database</b> = every member: from the join form or approved in the app. They're in the member list, birthdays and the sheet.</span></li>
    <li ${A(7.5)}><i>📱</i><span><b>On the app</b> = they also signed in with Google. Their service records, bills, fuel log and documents belong to that login.</span></li>
    <li ${A(9.5)}><i>🙂</i><span>Uninstalling the app or signing out <b>changes nothing</b>: they're still an RWB member.</span></li></ul></div>` });

/* 3. way 1 */
S.push({ chap: '2 · How people join', dur: 16, html: cap('How people join · Way 1', 'Through the join form', 'The usual way. <b>No admin action needed</b> to add them.') + `<div class="mg"><div class="steps">
  ${st('', '📝', 'Rider fills the join form', 'roninwb.in → Join us', .4)}
  ${st('', '📊', 'A row lands in the contact sheet', 'within seconds', 2)}
  ${st('hlb', '🗄️', 'Added to the database <span class="tag">New Member</span>', 'shows in the RWB tab straight away', 3.6)}
  ${st('', '🔔', 'Admins get a notification', '“New RWB registration”', 5.2)}
  ${st('hl', '✅', 'They install the app and sign in', 'with the same Google email as on the form → straight in, no approval', 6.8)}</div>
  <div class="warnc okc" style="top:1060px" ${A(9.5, 'up')}><span class="i">💡</span><span>Signed in with a <b>different Google account</b>? The app asks them for their details, and that becomes an access request (Way 2).</span></div></div>` });

/* 4. way 2 */
S.push({ chap: '2 · How people join', dur: 17, html: cap('How people join · Way 2', 'Straight from the app', 'Someone installs the app first. <b>An admin approves them.</b>') + `<div class="mg"><div class="steps">
  ${st('', '📱', 'Rider installs the app, signs in', 'their Google email isn\'t in the member list', .4)}
  ${st('', '🧾', 'They fill the join request', 'the same questions as the join form', 2)}
  ${st('hlo', '🔔', 'Admins are notified', 'notification + banner on Home: “access request waiting”', 3.6)}
  ${st('hlb', '👀', 'Admin checks and taps Approve', 'their WhatsApp number is matched with the sheet', 5.2)}
  ${st('hl', '🗄️', 'Added to database + sheet <span class="tag">New Member</span>', 'sheet row says “Added via: RWB App”', 6.8)}</div>
  <div class="warnc okc" style="top:1060px" ${A(9.6, 'up')}><span class="i">🔗</span><span>Number <b>already in the sheet</b>? Approving links the app to their existing record. No duplicate is created.</span></div></div>` });

/* app: approve */
S.push({ chap: '2 · How people join', app: 0 });

/* 5. tracking */
S.push({ chap: '3 · Track new members', dur: 15, html: cap('Track new members', 'Add them to WhatsApp', 'Both ways end up in the same place, so you only check <b>one list</b>.') + `<div class="mg">
  <div class="mini" ${A(.4, 'pop')}><div class="hd">RWB · Members</div>
    <div class="chips"><span>Everyone</span><span class="on">New (3)</span><span>On the app</span></div>
    ${[['KD', 'Kunal Das', 'Joined today · form'], ['PD', 'Priya Dutta', 'Joined yesterday · app'], ['SP', 'Sourav Paul', 'Joined 4 days ago · form']].map((r, i) => `<div class="row" ${A(1.2 + i * .5, 'left')}><i>${r[0]}</i><span>${r[1]}<small>${r[2]}</small></span><span class="nt">New Member</span></div>`).join('')}
    <div class="row" style="opacity:.45" ${A(2.8, 'left')}><i>AS</i><span>Arjun Sen<small>Joined 9 days ago</small></span></div></div>
  <div class="wa" style="left:820px;top:200px" ${A(3.6, 'pop')}>💬</div><span class="lbl" style="left:770px;top:370px" ${A(3.9, 'fade')}>Add to group</span>
  <svg viewBox="0 0 1080 1300"><path id="tw" class="draw" ${A(3.4, 'draw', .7)} d="M780 330 C 800 300, 810 290, 820 280" stroke="#2fbf71" stroke-width="6" fill="none"/></svg>
  <ul class="pts" style="top:960px">
    <li ${A(5)}><i>🆕</i><span>RWB tab → <b>New</b>: everyone who joined in the last <b>7 days</b>, from the form or the app.</span></li>

/* ======================= engine ======================= */
const stage = document.getElementById('stage');
const appBeats = i => { let t = 0; const sc = SHOTS[i]; const beats = sc.beats.map(b => { const o = { ...b, at: t, tapAt: b.tap ? t + Math.min(.95, b.hold - .55) : null }; t += b.hold; return o; }); return { cap: sc.cap, beats, dur: t }; };
S.forEach((s, si) => {
  if (s.app != null) { const a = appBeats(s.app); s.dur = a.dur; s.beats = a.beats;
    s.html = cap(a.cap.step, a.cap.title, a.cap.sub) + `<div class="phone"><div class="screen">${a.beats.map((b, bi) => `<div class="layer" data-b="${bi}"><img src="${b.img}">${b.overlay || ''}</div>`).join('')}<div class="ripple"></div><div class="finger"></div></div></div>`; }
  stage.insertAdjacentHTML('beforeend', `<div class="scene" data-s="${si}">${s.html}</div>`);
});
const scenes = [...stage.querySelectorAll('.scene')];
const TOTAL = S.reduce((a, s) => a + s.dur, 0); window.TOTAL = TOTAL;
const chaps = [...new Set(S.map(s => s.chap).filter(Boolean))];
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3), cl = x => Math.max(0, Math.min(1, x));
scenes.forEach(sc => sc.querySelectorAll('path.draw').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; }));
window.render = t => {
  let acc = 0, si = 0;
  for (; si < S.length - 1 && t >= acc + S[si].dur; si++) acc += S[si].dur;
  const s = S[si], lt = t - acc, sc = scenes[si];
  document.getElementById('bar').style.width = (t / TOTAL * 100).toFixed(2) + '%';
  document.getElementById('chap').textContent = s.chap; document.getElementById('chapn').textContent = s.chap ? `${chaps.indexOf(s.chap) + 1} / ${chaps.length}` : '';
  scenes.forEach((x, i) => { if (i !== si) x.style.opacity = 0; });
  const fin = ease(lt / .5), fout = si < S.length - 1 ? cl((s.dur - lt) / .35) : 1;
  sc.style.opacity = Math.min(fin, fout);
  const c = sc.querySelector('.cap'); if (c) c.style.transform = `translateY(${(1 - fin) * 30}px)`;
  /* motion graphics */
  sc.querySelectorAll('[data-a]').forEach(el => {
    const a = +el.dataset.a, d = +el.dataset.d || .55, fx = el.dataset.fx, p = ease((lt - a) / d);
    if (el.dataset.path) return;
    if (fx === 'draw') { el.style.strokeDashoffset = el.dataset.len * (1 - cl((lt - a) / d)); el.style.opacity = lt >= a ? 1 : 0; return; }
    el.style.opacity = p;
    el.style.transform = fx === 'up' ? `translateY(${(1 - p) * 40}px)` : fx === 'left' ? `translateX(${-(1 - p) * 70}px)` : fx === 'pop' ? `scale(${.86 + .14 * p})` : '';
  });
  sc.querySelectorAll('circle[data-path]').forEach(el => {
    const path = sc.querySelector('#' + el.dataset.path), a = +el.dataset.a, d = +el.dataset.d;
    if (lt < a) { el.style.opacity = 0; return; }
    const f = el.dataset.loop ? ((lt - a) / d) % 1 : cl((lt - a) / d), L = path.getTotalLength(), pt = path.getPointAtLength(L * f);
    el.setAttribute('cx', pt.x); el.setAttribute('cy', pt.y); el.style.opacity = f < .08 ? f / .08 : f > .9 ? (1 - f) / .1 : 1;
  });
  /* app screens */
  if (s.beats) {
    let bi = 0; s.beats.forEach((b, i) => { if (lt >= b.at) bi = i; });
    const layers = sc.querySelectorAll('.layer'), fade = cl((lt - s.beats[bi].at) / .2);
    layers.forEach((l, i) => { l.style.opacity = i === bi ? (bi ? fade : 1) : i === bi - 1 ? 1 : 0; l.style.zIndex = i === bi ? 2 : 1; });
    const b = s.beats[bi], f = sc.querySelector('.finger'), r = sc.querySelector('.ripple');
    if (b.tap) {
      const [x, y] = b.tap, ta = b.tapAt, p = ease((lt - (ta - .75)) / .55);
      f.style.left = (x + (1 - p) * 60) + 'px'; f.style.top = (y + (1 - p) * 120) + 'px';
      const vis = lt >= ta - .75 && lt <= ta + .4; f.style.opacity = vis ? Math.min(cl((lt - (ta - .75)) / .2), cl((ta + .4 - lt) / .18)) : 0;
      f.style.transform = `scale(${lt >= ta && lt <= ta + .18 ? .8 : 1})`;
      const rp = (lt - ta) / .5; r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.opacity = rp >= 0 && rp <= 1 ? 1 - rp : 0; r.style.transform = `scale(${1 + rp * 2.4})`;
    } else { f.style.opacity = 0; r.style.opacity = 0; }
  }
};
render(0);
</script></body></html>
