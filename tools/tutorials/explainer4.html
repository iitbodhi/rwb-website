<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RWB member management, simple</title>
<style>/*CSS*/
/* --- simple edition --- */
.cap h1{font-size:92px}
.cap p{font-size:40px}
.mg{top:620px;height:1060px}
.mg svg{height:1060px}
.phone{top:610px;width:504px;height:1040px;margin-left:-252px;border-radius:70px}
.screen{left:18px;top:18px;transform:scale(1.1896);border-radius:40px}
.sub{position:absolute;left:56px;right:56px;bottom:60px;min-height:150px;display:grid;place-items:center;text-align:center;padding:22px 34px;border-radius:30px;background:rgba(10,9,8,.82);border:1px solid rgba(255,255,255,.12);font:600 40px/1.28 'Barlow';color:#fff;z-index:30;box-shadow:0 20px 50px -20px rgba(0,0,0,.9)}
.sub span{display:block}
.big{position:absolute;left:70px;right:70px;display:grid;grid-template-columns:120px 1fr;gap:28px;align-items:center;padding:30px 34px;border-radius:32px;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.14)}
.big .i{font-size:84px;line-height:1;text-align:center}
.big b{display:block;font:800 52px/1.02 'Barlow Condensed';text-transform:uppercase}
.big span{display:block;font:500 32px/1.3 'Barlow';color:#d6cfc8;margin-top:6px}
.big.g{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,#151210)}
.big.r{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,#151210)}
.big.o{border-color:var(--o);background:color-mix(in srgb,var(--o) 15%,#151210)}
.big.b{border-color:var(--db);background:color-mix(in srgb,var(--db) 16%,#151210)}
.st b{font-size:46px}.st span{font-size:31px}
.cross{position:absolute;font:800 120px/1 'Barlow';color:var(--bad);text-shadow:0 6px 30px rgba(0,0,0,.6)}
.tick{position:absolute;font:800 110px/1 'Barlow';color:var(--ok);text-shadow:0 6px 30px rgba(0,0,0,.6)}
</style></head><body>
<div id="v"><i class="glow g1"></i><i class="glow g2"></i>
  <div class="topbar"><img src="" alt=""><div class="brand">RWB App<small>For admins</small></div><span class="pill">Members, made simple</span></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="chap"><span id="chap"></span><span id="chapn"></span></div>
  <div id="stage"></div>
  <div class="sub" id="sub"></div>
</div>
<script>/*data*/</script>
<script>
const SHOTS = window.SHOTS || [], LOGO = window.LOGO, VO = window.VO || {};
document.querySelector('.topbar img').src = LOGO;
const cap = (step, title, sub) => `<div class="cap"><div class="step">${step}</div><h1>${title}</h1><p>${sub}</p></div>`;
/* appear at a time: number (seconds) or 's2' / 's2+0.6' = when sentence 2 of the voice-over starts */
const A = (t, fx = 'up', d = .55) => `data-a="${t}" data-fx="${fx}" data-d="${d}"`;
const node = (cls, x, y, w, ico, title, sub, t) => `<div class="node ${cls}" style="left:${x}px;top:${y}px;width:${w}px" ${A(t, 'pop')}><span class="ico">${ico}</span><b>${title}</b><small>${sub}</small></div>`;
const st = (cls, ico, title, sub, t) => `<div class="st ${cls}" ${A(t, 'left')}><span class="n">${ico}</span><div><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</div></div>`;
const big = (cls, y, ico, title, sub, t) => `<div class="big ${cls}" style="top:${y}px" ${A(t, 'left')}><span class="i">${ico}</span><div><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</div></div>`;
const MK = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>`;

const S = [];
S.push({ id: 'intro', chap: '', html: `<div class="card" style="padding-bottom:200px"><img class="logo" src="${LOGO}"><p class="kicker">For RWB admins · The complete guide</p><h2>Managing <em>members</em></h2><p>Approvals, WhatsApp messages, follow-ups, and more.</p></div>` });
S.push({ id: 'list', chap: 'The big idea', html: cap('The big idea', 'One member list', 'Shown in the app. Copied to the sheet. <b>Synced both ways.</b>') + `<div class="mg">
  <svg viewBox="0 0 1080 1060">${MK('m1')}
    <path id="l1" class="draw" ${A('s2', 'draw', .7)} d="M430 255 L280 522" stroke="#e8662e" stroke-width="8" fill="none" marker-end="url(#m1)" marker-start="url(#m1)"/>
    <path id="l2" class="draw" ${A('s2+.6', 'draw', .7)} d="M650 255 L800 522" stroke="#22a565" stroke-width="8" fill="none" marker-end="url(#m1)" marker-start="url(#m1)"/>
    <circle r="13" fill="#ffc29f" data-path="l1" data-a="s3" data-d="1.3" data-loop="1"/><circle r="13" fill="#8ff0b8" data-path="l2" data-a="s3+.4" data-d="1.3" data-loop="1"/></svg>
  ${node('db', 290, 40, 500, '🗄️', 'Member list', 'every RWB member, in one place', 's1')}
  ${node('app', 60, 530, 440, '📱', 'The app', 'shows the list', 's2')}
  ${node('sheet', 580, 530, 440, '📊', 'Google Sheet', 'keeps a copy', 's2+.6')}
  <span class="lbl" style="left:395px;top:385px;font-size:28px;background:#1f9d55" ${A('s3', 'pop')}>⇄ both ways</span>
  ${big('g', 850, '✏️', 'Edit either one', 'the other updates by itself', 's4')}</div>` });

S.push({ id: 'join', chap: 'Joining', html: cap('Joining', 'Everyone waits for approval', 'Form or app: the <b>same questions</b>, the same T&C.') + `<div class="mg">
  <svg viewBox="0 0 1080 1060">${MK('m2')}
    <path id="j1" class="draw" ${A('s2', 'draw', .7)} d="M270 250 L470 420" stroke="#8b6cf6" stroke-width="8" fill="none" marker-end="url(#m2)"/>
    <path id="j2" class="draw" ${A('s2+.3', 'draw', .7)} d="M810 250 L610 420" stroke="#e8662e" stroke-width="8" fill="none" marker-end="url(#m2)"/>
    <path id="j3" class="draw" ${A('s3+1.4', 'draw', .7)} d="M540 660 L540 790" stroke="#2fbf71" stroke-width="8" fill="none" marker-end="url(#m2)"/>
    <circle r="13" fill="#c6b6ff" data-path="j1" data-a="s2+.8" data-d="1.4" data-loop="1"/><circle r="13" fill="#ffc29f" data-path="j2" data-a="s2+1.1" data-d="1.4" data-loop="1"/></svg>
  ${node('form', 60, 30, 420, '📝', 'Join form', 'roninwb.in', 's0')}
  ${node('app', 600, 30, 420, '📱', 'App join form', 'same as the Google Form', 's1')}
  ${node('', 300, 430, 480, '⏳', 'Approvals list', 'waiting for an admin', 's2')}
  <span class="lbl" style="left:600px;top:690px;font-size:28px;background:#e8662e" ${A('s3', 'pop')}>🔔 admins notified</span>
  ${node('sheet', 340, 800, 400, '✅', 'Member', 'after you approve', 's3+1.6')}</div>` });
S.push({ id: 'appadmin', chap: 'Joining', app: [0], cap: ['In the app', 'Admin, right on Home', 'Badges show what\'s waiting. Tap <b>Approvals</b>.'] });
S.push({ id: 'checks', chap: 'The 4 checks', html: cap('The 4 checks', 'On every entry', 'Look for <b>4 / 4</b> before approving.') + `<div class="mg">
  ${big('b', 20, '🆕', 'New or existing?', 'existing members pass', 's1')}
  ${big('o', 250, '🏍️', 'Has a Ronin?', 'from their answer', 's2')}
  ${big('g', 480, '🔎', 'VRN verified?', 'you tick it (earlier ones carry over)', 's3')}
  ${big('', 710, '📜', 'Agreed to the T&C?', 'RWB Terms & Conditions', 's4')}</div>` });
S.push({ id: 'app4checks', chap: 'The 4 checks', app: [1], cap: ['In the app', 'The 4 checks', 'New rider: 3 / 4. Existing member: <b>4 / 4</b>.'] });
S.push({ id: 'vrn', chap: 'The 4 checks', html: cap('The 4 checks', 'Verifying the VRN', 'Done by an admin. <b>No upload needed.</b>') + `<div class="mg">
  ${big('', 20, '📋', 'Copy the VRN', 'one tap', 's1')}
  ${big('b', 250, '🌐', 'Check it', 'on Parivahan, or with the rider', 's1+1.6')}
  ${big('g', 480, '☑️', 'Tick “VRN verified”', '', 's2')}
  ${big('r', 710, '⚠️', 'Same VRN as someone?', 'the card warns you', 's3')}</div>` });

S.push({ id: 'appapprove', chap: 'Approving', app: [2], cap: ['In the app', 'Approve + welcome', 'A ready WhatsApp message, sent from <b>your</b> WhatsApp.'] });
S.push({ id: 'msgs', chap: 'Approving', html: cap('Approving', 'A message for every case', 'Ready-made. Editable. <b>Free.</b>') + `<div class="mg">
  ${big('g', 20, '🎉', 'Welcome!', 'new member · added to the group within 72 hours', 's1')}
  ${big('b', 250, '👋', 'Hi Warrior!', 'existing member · quick guide to the app', 's2')}
  ${big('r', 480, '🙏', 'A polite no', 'with the reason, and an offer to help', 's3')}
  ${big('', 710, '✏️', 'Edit before sending', 'it\'s your message', 's4')}</div>` });
S.push({ id: 'appexisting', chap: 'Approving', app: [3], cap: ['In the app', 'Existing member', 'Already in the group: <b>“Hi Warrior!”</b>'] });
S.push({ id: 'appreject', chap: 'Approving', app: [4], cap: ['In the app', 'Reject, politely', 'Pick a reason → polite message → <b>Rejected</b> tab.'] });
S.push({ id: 'changes', chap: 'Profile changes', html: cap('Profile changes', 'Important changes need you', 'Everything else saves straight away.') + `<div class="mg">
  <div class="steps">
  ${st('hlo', '✍️', 'Name', '', 's1')}
  ${st('hlo', '📞', 'WhatsApp No.', '', 's1+.5')}
  ${st('hlo', '🏍️', 'Main bike / VRN', '', 's1+1.0')}
  ${st('hlo', '➕', 'A new bike', '', 's1+1.5')}
  ${st('bad', '📜', 'Withdrawing from the T&C', '', 's1+2.0')}
  ${st('hl', '⚡', 'Everything else: instant', 'locality, blood group, birthday…', 's2')}</div></div>` });
S.push({ id: 'appchanges', chap: 'Profile changes', app: [5], cap: ['In the app', 'Changes to approve', 'Old → new. Verify the VRN → <b>Approve</b>.'] });
S.push({ id: 'appshare', chap: 'Profile changes', app: [6], cap: ['In the app', 'Tell the admin group', 'One tap: a summary to the admin WhatsApp group.'] });
S.push({ id: 'followups', chap: 'Follow-ups', html: cap('Follow-ups', 'Nobody slips through', 'For members already on the list.') + `<div class="mg">
  ${big('r', 20, '📜', 'Not agreed to the T&C', 'older members without an answer', 's1')}
  ${big('o', 250, '✍️', 'Missing details', 'emergency contact, blood group…', 's1+2.2')}
  ${big('g', 480, '🔔', 'Auto reminder in the app', 'every Sunday, members on the app', 's2')}
  ${big('b', 710, '💬', 'WhatsApp reminder', 'one tap, for everyone else', 's3')}</div>` });
S.push({ id: 'appfollow', chap: 'Follow-ups', app: [7], cap: ['In the app', 'Follow-ups', 'WhatsApp · Agreed · in-app reminders now.'] });
S.push({ id: 'sheet', chap: 'The sheet', html: cap('The Google Sheet', 'The “App · Status” column', 'Every row shows where it stands.') + `<div class="mg">
  <table class="cmp" style="top:10px"><tr ${A('s0', 'fade')}><th>Rider</th><th>App · Status</th></tr>
    <tr ${A('s1', 'left')}><td>Kunal Das</td><td><span class="tag left" style="margin:0">Waiting for approval</span></td></tr>
    <tr ${A('s2', 'left')}><td>Priya Dutta</td><td><span class="tag" style="margin:0">Member</span></td></tr>
    <tr ${A('s3', 'left')}><td>Riya Basu</td><td><span class="tag removed" style="margin:0">→ Rejected tab</span></td></tr>
    <tr ${A('s3+2.2', 'left')}><td>Old duplicate row</td><td><span class="tag app" style="margin:0;background:rgba(61,134,240,.22);color:#9cc3ff">→ Older entries tab</span></td></tr></table>
  ${big('g', 640, '🤖', 'Kept up to date for you', 'no need to change these by hand', 's3+3.5')}</div>` });

S.push({ id: 'appnew', chap: 'New members', app: [8], cap: ['In the app', 'Every week: New → WhatsApp', 'RWB tab → <b>New</b> → verify bikes → <b>WhatsApp</b>.'] });
S.push({ id: 'results', chap: 'Leaving', html: cap('When someone leaves', 'What happens next', 'All automatic.') + `<div class="mg">
  ${big('', 20, '👥', 'Gone from the member list', '', 's1')}
  ${big('r', 250, '📱', 'App login + data deleted', '', 's2')}
  ${big('g', 480, '📊', 'Sheet row moves', 'to the “Removed members” tab', 's3')}
  ${big('b', 710, '👀', 'Admins still see them', 'under Left / removed', 's4')}</div>` });

S.push({ id: 'appremove', chap: 'Leaving', app: [9], cap: ['When someone leaves', 'Remove, and restore', '<b>Remove from RWB</b> · mistake? <b>Restore</b>.'] });
S.push({ id: 'appmembers', chap: 'Members', app: [10], cap: ['What members see', 'Nudges and approvals', 'Agree to the <b>T&C</b> · changes go to admins.'] });
S.push({ id: 'appjoin', chap: 'Members', app: [11], cap: ['What new riders see', 'The join form', 'The same as the Google Form, <b>T&C first</b>.'] });
S.push({ id: 'donts', chap: 'Summary', html: cap('Careful', 'These do NOT remove anyone', 'Only the app button does.') + `<div class="mg">
  ${big('r', 20, '🚫', 'Deleting a sheet row by hand', '', 's1')}
  ${big('r', 250, '📵', 'Uninstalling the app', '', 's2')}
  ${big('g', 560, '✅', 'Use Remove from RWB', 'in the app, every time', 's3')}</div>` });

S.push({ id: 'rules', chap: 'Summary', html: cap('Summary', 'Five simple habits', 'That\'s all it takes.') + `<div class="mg">
  ${big('o', 0, '1', 'Approvals daily, at 4 / 4', '', 's1')}
  ${big('g', 200, '2', 'Always send the message', 'the ready WhatsApp message', 's2')}
  ${big('b', 400, '3', 'Share with the admin group', 'when needed', 's3')}
  ${big('', 600, '4', 'Weekly: New + follow-ups', 'WhatsApp group, reminders', 's4')}
  ${big('r', 800, '5', 'Remove only with the button', 'Remove from RWB', 's5')}</div>` });
S.push({ id: 'outro', chap: '', html: `<div class="card" style="padding-bottom:200px"><div class="check">✓</div><h2>Thank <em>you!</em></h2><p>Explore. Evolve. Inspire.</p><span class="tagx">Questions? Ask Bodhi</span></div>` });
/* ======================= engine ======================= */
const stage = document.getElementById('stage');
S.forEach((s, si) => {
  const vo = VO[s.id] || { dur: 5, sents: [] };
  s.sents = vo.sents;
  if (s.app) {
    let beats = [], t = 0;
    s.app.forEach(i => SHOTS[i].beats.forEach(b => beats.push({ ...b })));
    const raw = beats.reduce((a, b) => a + b.hold, 0), want = vo.dur - .3, k = Math.max(1, want / raw);
    beats.forEach(b => { b.hold *= k; b.at = t + .3; b.tapAt = b.tap ? b.at + Math.min(1.1, b.hold - .6) : null; t += b.hold; });
    s.beats = beats; s.dur = Math.max(vo.dur, t + .5);
    s.html = cap(...s.cap) + `<div class="phone"><div class="screen">${beats.map((b, bi) => `<div class="layer" data-b="${bi}"><img src="${b.img}">${b.overlay || ''}</div>`).join('')}<div class="ripple"></div><div class="finger"></div></div></div>`;
  } else s.dur = vo.dur;
  stage.insertAdjacentHTML('beforeend', `<div class="scene" data-s="${si}">${s.html}</div>`);
});
const scenes = [...stage.querySelectorAll('.scene')];
let acc0 = 0; window.SCENES = S.map(s => { const o = { id: s.id, start: acc0, dur: s.dur, sents: s.sents }; acc0 += s.dur; return o; });
const TOTAL = acc0; window.TOTAL = TOTAL;
const chaps = [...new Set(S.map(s => s.chap).filter(Boolean))];
const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3), cl = x => Math.max(0, Math.min(1, x));
const at = (s, v) => { const m = String(v).match(/^s(\d+)([+-][\d.]+)?$/); if (!m) return +v; const se = s.sents[+m[1]]; return (se ? se.t : 0) + (m[2] ? +m[2] : 0); };
scenes.forEach((sc, i) => {
  sc.querySelectorAll('[data-a]').forEach(el => el.dataset.at = at(S[i], el.dataset.a));
  sc.querySelectorAll('path.draw').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
});
const subEl = document.getElementById('sub');
window.render = t => {
  let acc = 0, si = 0;
  for (; si < S.length - 1 && t >= acc + S[si].dur; si++) acc += S[si].dur;
  const s = S[si], lt = t - acc, sc = scenes[si];
  document.getElementById('bar').style.width = (t / TOTAL * 100).toFixed(2) + '%';
  document.getElementById('chap').textContent = s.chap; document.getElementById('chapn').textContent = s.chap ? `${chaps.indexOf(s.chap) + 1} / ${chaps.length}` : '';
  scenes.forEach((x, i) => { if (i !== si) x.style.opacity = 0; });
  const fin = ease(lt / .5), fout = si < S.length - 1 ? cl((s.dur - lt) / .35) : 1;
  sc.style.opacity = Math.min(fin, fout);
  const c = sc.querySelector('.cap'); if (c) c.style.transform = `translateY(${(1 - fin) * 30}px)`;
  /* subtitles: the sentence being spoken (kept until the next one starts) */
  let cur = null; s.sents.forEach(x => { if (lt >= x.t - .1) cur = x; });
  const txt = cur && lt <= cur.t + cur.d + .6 ? cur.text : '';
  if (subEl.dataset.txt !== txt) { subEl.dataset.txt = txt; subEl.innerHTML = txt ? `<span>${txt}</span>` : ''; }
  subEl.style.opacity = txt ? Math.min(1, cl((lt - cur.t + .1) / .2)) * Math.min(fin, fout) : 0;
  sc.querySelectorAll('[data-a]').forEach(el => {
    if (el.dataset.path) return;
    const a = +el.dataset.at, d = +el.dataset.d || .55, fx = el.dataset.fx, p = ease((lt - a) / d);
    if (fx === 'draw') { el.style.strokeDashoffset = el.dataset.len * (1 - cl((lt - a) / d)); el.style.opacity = lt >= a ? 1 : 0; return; }
    el.style.opacity = p;
    el.style.transform = fx === 'up' ? `translateY(${(1 - p) * 40}px)` : fx === 'left' ? `translateX(${-(1 - p) * 70}px)` : fx === 'pop' ? `scale(${.86 + .14 * p})` : '';
  });
  sc.querySelectorAll('circle[data-path]').forEach(el => {
    const path = sc.querySelector('#' + el.dataset.path), a = +el.dataset.at, d = +el.dataset.d;
    if (lt < a) { el.style.opacity = 0; return; }
    const f = ((lt - a) / d) % 1, L = path.getTotalLength(), pt = path.getPointAtLength(L * f);
    el.setAttribute('cx', pt.x); el.setAttribute('cy', pt.y); el.style.opacity = f < .08 ? f / .08 : f > .9 ? (1 - f) / .1 : 1;
  });
  if (s.beats) {
    let bi = 0; s.beats.forEach((b, i) => { if (lt >= b.at) bi = i; });
    const layers = sc.querySelectorAll('.layer'), fade = cl((lt - s.beats[bi].at) / .2);
    layers.forEach((l, i) => { l.style.opacity = i === bi ? (bi ? fade : 1) : i === bi - 1 ? 1 : 0; l.style.zIndex = i === bi ? 2 : 1; });
    const b = s.beats[bi], f = sc.querySelector('.finger'), r = sc.querySelector('.ripple');
    if (b.tap) {
      const [x, y] = b.tap, ta = b.tapAt, p = ease((lt - (ta - .75)) / .55);
      f.style.left = (x + (1 - p) * 60) + 'px'; f.style.top = (y + (1 - p) * 120) + 'px';
      const vis = lt >= ta - .75 && lt <= ta + .4; f.style.opacity = vis ? Math.min(cl((lt - (ta - .75)) / .2), cl((ta + .4 - lt) / .18)) : 0;
      f.style.transform = `scale(${lt >= ta && lt <= ta + .18 ? .8 : 1})`;
      const rp = (lt - ta) / .5; r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.opacity = rp >= 0 && rp <= 1 ? 1 - rp : 0; r.style.transform = `scale(${1 + rp * 2.4})`;
    } else { f.style.opacity = 0; r.style.opacity = 0; }
  }
};
render(0);
</script></body></html>
