# Builds the RWB Android app (android-app/) in two versions:
#   - the APK published as roninwb.in/download/RWB-App.apk (website installs), and
#   - the Google Play Store version (an .aab), sent to the Play Store by itself once PLAY_SERVICE_ACCOUNT_JSON is set.
# Runs when the Android app's files change, or by hand (Actions → Android app → Run workflow).
# Each published build also writes download/latest.json; apps older than it show "New Update Available".
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   RWB_KEYSTORE_B64, RWB_STORE_PASSWORD, RWB_KEY_PASSWORD   (the app's signing key: updates install over the old app)
#   GOOGLE_SERVICES_JSON                                     (Firebase, for notifications)
#   PLAY_SERVICE_ACCOUNT_JSON (optional)                     (Google Play: uploads each build to the Play Store)
# Repository variable PLAY_TRACK (optional): the Play Store track to upload to: internal, alpha (closed testing, the
# default), beta (open testing) or production.
# Without the signing key it only checks that the app builds (nothing is published).
name: Android app
on:
  push:
    branches: [main]
    paths: ['android-app/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: android-app, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: android-app, shell: bash } }
    env:
      HAS_KEY: ${{ secrets.RWB_KEYSTORE_B64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a ../build.log
          npx cap --version | tee -a ../build.log
      - name: Create the Android project
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -o pipefail
          rm -rf android
          npx cap add android 2>&1 | tee -a ../build.log
          if [ "$HAS_KEY" = "true" ]; then
            echo "${{ secrets.RWB_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/rwb.keystore"
            echo "RWB_KEYSTORE=$RUNNER_TEMP/rwb.keystore" >> $GITHUB_ENV
          fi
          if [ "$HAS_FIREBASE" = "true" ]; then
            printf '%s' "$GSJ" > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret: notifications won't work in this build" | tee -a ../build.log
          fi
      - name: Make it the RWB app
        run: |
          set -o pipefail
          RWB_KEYSTORE="${RWB_KEYSTORE:-}" node scripts/patch-android.mjs 2>&1 | tee -a ../build.log
          npx cap sync android 2>&1 | tee -a ../build.log
      - name: Build
        env:
          RWB_STORE_PASSWORD: ${{ secrets.RWB_STORE_PASSWORD }}
          RWB_KEY_PASSWORD: ${{ secrets.RWB_KEY_PASSWORD }}
          RWB_KEY_ALIAS: my-key-alias
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tail -n 400 | tee -a ../../build.log || { echo "retrying once" | tee -a ../../build.log; sleep 20; ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tail -n 400 | tee -a ../../build.log; }
          ls -la app/build/outputs/apk/release/ | tee -a ../../build.log
      - name: Publish to roninwb.in/download
        if: env.HAS_KEY == 'true'
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ../download/RWB-App.apk
          # the app checks this file: older builds show "New Update Available" until they update
          echo "{\"build\": $((100 + ${{ github.run_number }})), \"version\": \"2.0.${{ github.run_number }}\"}" > ../download/latest.json
          cd ..
          git config user.name "RWB build bot"; git config user.email "actions@github.com"
          git add download/RWB-App.apk download/latest.json
          git commit -m "RWB Android app build ${{ github.run_number }}" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
      - name: Build the Google Play Store version (.aab)
        if: env.HAS_KEY == 'true'
        env:
          RWB_STORE_PASSWORD: ${{ secrets.RWB_STORE_PASSWORD }}
          RWB_KEY_PASSWORD: ${{ secrets.RWB_KEY_PASSWORD }}
          RWB_KEY_ALIAS: my-key-alias
        run: |
          set -o pipefail
          node scripts/play-variant.mjs 2>&1 | tee -a ../build.log
          cd android
          ./gradlew --no-daemon --stacktrace bundleRelease 2>&1 | tail -n 200 | tee -a ../../build.log
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/RWB-Play-${{ github.run_number }}.aab"
          ls -la "$RUNNER_TEMP"/*.aab | tee -a ../../build.log
      - name: Keep the Play Store file (Actions → this run → Artifacts)
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RWB-Play-${{ github.run_number }}
          path: ${{ runner.temp }}/RWB-Play-${{ github.run_number }}.aab
          retention-days: 30
      - name: Send to the Google Play Store
        if: env.HAS_KEY == 'true' && env.HAS_PLAY == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.roninwb.twa
          releaseFiles: ${{ runner.temp }}/RWB-Play-${{ github.run_number }}.aab
          releaseName: "2.0.${{ github.run_number }}"
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
      - name: Save the build log (for fixing problems)
        if: always()
        working-directory: .
        run: |
          echo "result: ${{ job.status }} run ${{ github.run_number }} key=$HAS_KEY firebase=$HAS_FIREBASE" >> build.log
          git config user.name "RWB build bot"; git config user.email "actions@github.com"
          git fetch origin android-build-log || true
          git checkout -B android-build-log
          git rm -r -q --cached . || true
          git add -f build.log
          git commit -q -m "build log ${{ github.run_number }}"
          git push -f origin android-build-log
